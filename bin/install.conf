# OpenInstall settings for a self-hosted wx93 (bin/install.sh). No secrets here:
# put COINPAY_*, RESEND_API_KEY etc. in ~/.local/share/wx93/app.env if you want them.
# With no CoinPay settings every account is on Free and payments are off.
APP=wx93
RUNTIME=bun
INSTALL_CMD=bun install --production
BUILD_CMD=none
START_CMD=bun apps/web/src/main.js
PORT=3000
HEALTH_PATH=/healthz
POSTGRES=nineq
MAX_BODY=2m
